<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi đến chú yêu của cháu 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #2a1a22 0%, #3d2433 30%, #4a2c3a 60%, #5c3345 100%);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: default;
        }

        /* Soft glowing orbs */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: floatGlow 14s ease-in-out infinite;
        }
        .bg-glow:nth-child(1) {
            width: 520px; height: 520px;
            top: -12%; left: -8%;
            background: radial-gradient(circle, rgba(180, 60, 100, 0.25) 0%, transparent 70%);
        }
        .bg-glow:nth-child(2) {
            width: 480px; height: 480px;
            bottom: -15%; right: -10%;
            background: radial-gradient(circle, rgba(150, 40, 80, 0.2) 0%, transparent 70%);
            animation-delay: -5s;
        }
        .bg-glow:nth-child(3) {
            width: 360px; height: 360px;
            top: 35%; left: 55%;
            background: radial-gradient(circle, rgba(160, 50, 90, 0.18) 0%, transparent 70%);
            animation-delay: -9s;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(25px, -30px) scale(1.08); }
        }

        /* ===== MÂY THẬT HƠN ===== */
        .cloud {
            position: absolute;
            background: rgba(255, 200, 220, 0.08);
            border-radius: 100px;
            filter: blur(8px);
            z-index: 1;
            pointer-events: none;
            animation: cloudMove linear infinite;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        .cloud::before {
            width: 60%;
            height: 110%;
            top: -40%;
            left: 15%;
        }

        .cloud::after {
            width: 45%;
            height: 90%;
            top: -25%;
            right: 10%;
        }

        @keyframes cloudMove {
            0% { transform: translateX(-20vw); }
            100% { transform: translateX(120vw); }
        }

        /* ===== SAO BĂNG ===== */
        .shooting-star {
            position: absolute;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0.9), transparent);
            border-radius: 50%;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            animation: shoot 1.4s ease-out forwards;
            box-shadow: 0 0 6px 1px rgba(255, 220, 240, 0.7);
        }

        .shooting-star::before {
            content: "";
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            left: 0;
            top: -2px;
            box-shadow: 0 0 10px 3px rgba(255, 200, 220, 0.9);
        }

        @keyframes shoot {
            0% {
                opacity: 1;
                transform: translateX(0) translateY(0) rotate(-35deg);
            }
            100% {
                opacity: 0;
                transform: translateX(280px) translateY(180px) rotate(-35deg);
            }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            8% { opacity: 0.7; }
            90% { opacity: 0.5; }
            100% {
                transform: translateY(-15vh) rotate(720deg) scale(1.1);
                opacity: 0;
            }
        }

        /* Trái tim rơi - dày hơn */
        .falling-heart {
            position: absolute;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            animation: fallHeart linear forwards;
            text-shadow: 0 0 12px rgba(255, 105, 180, 0.5);
        }

        @keyframes fallHeart {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            10% { opacity: 0.85; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(110vh) rotate(480deg) scale(1.1);
                opacity: 0;
            }
        }

        /* Mouse trail */
        .trail {
            position: fixed;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #e07090;
            box-shadow: 0 0 10px 2px rgba(224, 112, 144, 0.6);
            pointer-events: none;
            z-index: 50;
            animation: trailFade 0.9s ease-out forwards;
        }

        @keyframes trailFade {
            0% { transform: scale(1); opacity: 0.85; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Main card */
        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 540px;
            background: rgba(40, 22, 32, 0.82);
            backdrop-filter: blur(22px);
            border-radius: 30px;
            padding: 42px 38px;
            text-align: center;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(255, 140, 170, 0.25),
                inset 0 0 40px rgba(255, 120, 150, 0.06);
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            animation: cardIn 1.3s cubic-bezier(0.22,1,0.36,1) forwards;
            overflow: hidden;
        }

        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(50px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 32px;
            background: linear-gradient(45deg, #c45a7a, #a04060, #d07090, #c45a7a);
            background-size: 300% 300%;
            z-index: -1;
            opacity: 0.4;
            animation: borderGlow 7s ease infinite;
            filter: blur(10px);
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff8fab, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #e8a0b5;
            opacity: 0.9;
            margin-bottom: 26px;
            font-weight: 500;
        }

        .message-box {
            background: linear-gradient(160deg, rgba(60, 30, 45, 0.7), rgba(50, 25, 40, 0.75));
            border-radius: 20px;
            padding: 28px 24px;
            margin-bottom: 26px;
            border: 1px solid rgba(255, 150, 180, 0.2);
            box-shadow: inset 0 3px 15px rgba(0, 0, 0, 0.25);
            min-height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .message {
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem;
            line-height: 1.75;
            color: #ffc2d4;
            font-weight: 600;
            text-align: center;
            opacity: 1;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .message.fade-out {
            opacity: 0;
            transform: scale(0.96);
        }

        .cursor {
            display: inline-block;
            color: #ff8fab;
            font-weight: 400;
            animation: blink 0.75s step-end infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .big-heart {
            font-size: 4.4rem;
            margin: 8px 0 24px;
            display: inline-block;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
            filter: drop-shadow(0 0 16px rgba(255, 100, 140, 0.5));
            user-select: none;
        }

        .big-heart:hover {
            transform: scale(1.18);
        }

        .big-heart.beat {
            animation: strongBeat 0.6s ease;
        }

        @keyframes strongBeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.35); }
            50% { transform: scale(0.95); }
            75% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .btn-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 13px 28px;
            border: none;
            border-radius: 50px;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
        }

        .btn-primary {
            background: linear-gradient(135deg, #c45a7a, #e07090);
            color: #fff5f7;
        }

        .btn-primary:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 12px 30px rgba(196, 90, 122, 0.45);
        }

        .btn-secondary {
            background: rgba(60, 30, 45, 0.9);
            color: #ffb3c6;
            border: 2px solid rgba(255, 150, 180, 0.35);
        }

        .btn-secondary:hover {
            background: rgba(80, 40, 60, 0.95);
            transform: translateY(-4px);
        }

        .footer-note {
            margin-top: 22px;
            font-size: 0.84rem;
            color: #e8a0b5;
            opacity: 0.85;
            font-style: italic;
        }

        .music-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c45a7a, #e07090);
            border: none;
            color: white;
            font-size: 1.45rem;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
            z-index: 100;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-btn:hover {
            transform: scale(1.12) rotate(10deg);
        }

        .music-btn.paused {
            background: linear-gradient(135deg, #5a4a50, #6b5b63);
        }

        .burst {
            position: fixed;
            pointer-events: none;
            z-index: 200;
            font-size: 20px;
            animation: burstOut 1.4s cubic-bezier(0.22,1,0.36,1) forwards;
        }

        @keyframes burstOut {
            0% {
                transform: translate(0,0) scale(0.4) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.1) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .card { padding: 32px 22px; }
            .title { font-size: 2.2rem; }
            .message { font-size: 1.4rem; }
            .big-heart { font-size: 3.6rem; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow"></div>
    <div class="bg-glow"></div>

    <div class="card" id="card">
        <h1 class="title">Gửi đến chú yêu</h1>
        <p class="subtitle">Một món quà nhỏ từ trái tim cháu 💌</p>

        <div class="message-box">
            <div class="message" id="message"></div>
        </div>

        <div class="big-heart" id="bigHeart" title="Chạm vào nhé 💕">❤️</div>

        <div class="btn-group">
            <button class="btn btn-primary" id="nextBtn">Cháu yêu chú nhiều hơn nữa 💖</button>
            <button class="btn btn-secondary" id="burstBtn">Rắc tim ✨</button>
        </div>

        <p class="footer-note">Mỗi ngày bên chú đều là ngày hạnh phúc nhất của cháu</p>
    </div>

    <button class="music-btn" id="musicBtn" title="Bật / Tắt nhạc">🎵</button>

    <audio id="bgMusic" loop>
        <source src="https://direct-silver-jym7tyxa.edgeone.dev/" type="audio/mpeg">
    </audio>

    <script>
        const loveLetters = [
            "Chú à...\nCảm ơn chú vì đã bước vào cuộc đời cháu.",
            "Mỗi ngày được nhìn thấy nụ cười của chú\nlà ngày cháu thấy cuộc sống này thật đẹp.",
            "Cháu không biết nói gì cho đủ...\nChỉ biết rằng cháu yêu chú rất nhiều, rất nhiều 💕",
            "Dù mai này thế nào đi nữa,\ncháu vẫn muốn được nắm tay chú đi hết quãng đường dài.",
            "Chú là món quà quý giá nhất\nmà cuộc đời đã ban tặng cho cháu ❤️"
        ];

        let currentIndex = 0;
        let isTyping = false;
        const messageEl = document.getElementById('message');
        const card = document.getElementById('card');

        function typeMessage(text) {
            if (isTyping) return;
            isTyping = true;

            messageEl.classList.add('fade-out');

            setTimeout(() => {
                messageEl.innerHTML = '';
                messageEl.classList.remove('fade-out');

                let i = 0;
                function type() {
                    if (i < text.length) {
                        const char = text[i];
                        if (char === '\n') {
                            messageEl.innerHTML += '<br>';
                        } else {
                            messageEl.innerHTML += char;
                        }
                        const oldCursor = messageEl.querySelector('.cursor');
                        if (oldCursor) oldCursor.remove();
                        messageEl.innerHTML += '<span class="cursor">|</span>';
                        i++;
                        setTimeout(type, 42 + Math.random() * 28);
                    } else {
                        isTyping = false;
                    }
                }
                type();
            }, 320);
        }

        typeMessage(loveLetters[0]);

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (isTyping) return;
            currentIndex = (currentIndex + 1) % loveLetters.length;
            typeMessage(loveLetters[currentIndex]);
            createBurst(18);
        });

        const bigHeart = document.getElementById('bigHeart');
        bigHeart.addEventListener('click', () => {
            bigHeart.classList.remove('beat');
            void bigHeart.offsetWidth;
            bigHeart.classList.add('beat');
            createBurst(28);
        });

        document.getElementById('burstBtn').addEventListener('click', () => createBurst(22));

        function createBurst(count = 20) {
            const emojis = ['❤️', '💕', '💗', '💖', '✨', '🌸', '💓', '💞', '🌟'];
            const rect = bigHeart.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'burst';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = cx + 'px';
                el.style.top = cy + 'px';
                const angle = Math.random() * Math.PI * 2;
                const dist = 80 + Math.random() * 160;
                el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                el.style.fontSize = (14 + Math.random() * 16) + 'px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1500);
            }
        }

        // Particles bay lên
        function spawnParticle() {
            const emojis = ['❤️', '💕', '💗', '💖', '✨', '🌸', '🌟', '💫'];
            const p = document.createElement('div');
            p.className = 'particle';
            p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = (15 + Math.random() * 20) + 'px';
            p.style.animationDuration = (7 + Math.random() * 7) + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 15000);
        }
        setInterval(spawnParticle, 650);

        // Trái tim rơi - tăng mật độ
        function spawnFallingHeart() {
            const hearts = ['❤️', '💕', '💗', '💖', '💓', '💞', '❤️‍🔥'];
            const h = document.createElement('div');
            h.className = 'falling-heart';
            h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = (16 + Math.random() * 24) + 'px';
            h.style.animationDuration = (4.5 + Math.random() * 5.5) + 's';
            h.style.opacity = 0.65 + Math.random() * 0.3;
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 11000);
        }
        setInterval(spawnFallingHeart, 260); // dày hơn trước

        // ===== MÂY =====
        function createClouds() {
            for (let i = 0; i < 6; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                const size = 120 + Math.random() * 180;
                cloud.style.width = size + 'px';
                cloud.style.height = (size * 0.35) + 'px';
                cloud.style.top = (5 + Math.random() * 40) + 'vh';
                cloud.style.left = (-20 - Math.random() * 30) + 'vw';
                cloud.style.opacity = 0.06 + Math.random() * 0.1;
                cloud.style.animationDuration = (40 + Math.random() * 50) + 's';
                cloud.style.animationDelay = (-Math.random() * 40) + 's';
                document.body.appendChild(cloud);
            }
        }
        createClouds();

        // ===== SAO BĂNG =====
        function spawnShootingStar() {
            const star = document.createElement('div');
            star.className = 'shooting-star';
            star.style.left = (Math.random() * 70) + 'vw';
            star.style.top = (Math.random() * 40) + 'vh';
            star.style.animationDuration = (1.1 + Math.random() * 0.6) + 's';
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 1600);
        }
        setInterval(spawnShootingStar, 2200 + Math.random() * 1800);

        // Mouse trail
        let lastTrail = 0;
        document.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastTrail < 35) return;
            lastTrail = now;

            const trail = document.createElement('div');
            trail.className = 'trail';
            trail.style.left = e.clientX + 'px';
            trail.style.top = e.clientY + 'px';
            document.body.appendChild(trail);
            setTimeout(() => trail.remove(), 900);
        });

        // Card 3D tilt
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 12;
            const y = (e.clientY / window.innerHeight - 0.5) * -12;
            card.style.transform = `perspective(1000px) rotateY(${x}deg) rotateX(${y}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(1000px) rotateY(0) rotateX(0)';
        });

        // Music
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;
        music.volume = 0.45;

        function playMusicFrom30() {
            music.currentTime = 30;
            music.play().catch(() => {});
        }

        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                music.pause();
                musicBtn.classList.add('paused');
                musicBtn.textContent = '🔇';
            } else {
                playMusicFrom30();
                musicBtn.classList.remove('paused');
                musicBtn.textContent = '🎵';
            }
            isPlaying = !isPlaying;
        });

        music.addEventListener('ended', () => {
            if (isPlaying) {
                playMusicFrom30();
            }
        });

        music.addEventListener('loadedmetadata', () => {
            music.currentTime = 30;
        });
    </script>
</body>
</html>
